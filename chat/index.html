<style>
/* Layout: control bar on top (step caption, clock, next/back), two phone frames side by side, branch switches below; phones stack with a tab switch under 860px */
:root{
  --bg:#eef3f1; --surface:#ffffff; --surface-2:#e6eeea; --fg:#13211d; --muted:#596a64; --line:#d3ddd9;
  --accent:#0c6857; --accent-ink:#ffffff; --accent-soft:#d3eae2;
  --chat:#e9efe8; --me:#d6efe2; --them:#ffffff; --btn:#0c6857; --tpl:#b67507; --tpl-soft:#f5e8cf;
  --frame:#1b2622; --pulse:rgba(12,104,87,.35);
  --font:'Schibsted Grotesk',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c1311; --surface:#131c19; --surface-2:#1a2521; --fg:#e3ede9; --muted:#93a39d; --line:#283631;
  --accent:#45c2a4; --accent-ink:#04231b; --accent-soft:#163a31;
  --chat:#0f1915; --me:#17402f; --them:#1b2622; --btn:#5fd1b3; --tpl:#e4a944; --tpl-soft:#3a2e16;
  --frame:#000; --pulse:rgba(69,194,164,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1311; --surface:#131c19; --surface-2:#1a2521; --fg:#e3ede9; --muted:#93a39d; --line:#283631;
  --accent:#45c2a4; --accent-ink:#04231b; --accent-soft:#163a31;
  --chat:#0f1915; --me:#17402f; --them:#1b2622; --btn:#5fd1b3; --tpl:#e4a944; --tpl-soft:#3a2e16;
  --frame:#000; --pulse:rgba(69,194,164,.4); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

/* top */
.top{padding-block:14px 10px;display:flex;flex-direction:column;gap:10px}
.bar{display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px;margin-right:auto}
.brand svg{width:28px;height:28px}
.bname{font-weight:800;font-size:1.3rem;letter-spacing:-.03em}.bo{color:var(--accent)}
.sub{font-size:.82rem;color:var(--muted);font-weight:600}
.seg{display:inline-flex;background:var(--surface-2);border-radius:99px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:99px;font-weight:600;font-size:.86rem;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.ctl{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.cap{flex:1 1 320px;min-width:0}
.cap .k{font-size:.74rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.cap p{margin:2px 0 0;font-weight:600}
.clock{font-family:var(--mono);font-size:.85rem;background:var(--surface-2);padding:5px 9px;border-radius:8px;white-space:nowrap}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:9px;font-weight:600;font-size:.9rem;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn[disabled]{opacity:.45;cursor:not-allowed}

/* phones */
.tabs{display:none;gap:6px}
.stage{display:grid;grid-template-columns:repeat(2,minmax(0,380px));justify-content:center;gap:28px;padding-block:6px 14px}
.phone{background:var(--frame);border-radius:38px;padding:10px;box-shadow:0 10px 30px rgba(0,0,0,.18);min-width:0}
.screen{background:var(--chat);border-radius:30px;overflow:hidden;display:flex;flex-direction:column;height:min(720px,calc(100vh - 230px));min-height:520px;position:relative}
.who{font-size:.78rem;font-weight:700;text-align:center;color:var(--muted);margin:0 0 8px;letter-spacing:.04em;text-transform:uppercase}
.ph-head{display:flex;align-items:center;gap:10px;padding:14px 14px 10px;background:var(--surface);border-bottom:1px solid var(--line)}
.ph-head svg{width:34px;height:34px;flex:none}
.ph-head b{display:block;font-size:.98rem}
.ph-head span{font-size:.75rem;color:var(--muted)}
.ph-head .v{color:var(--accent);font-weight:700}
.msgs{flex:1;overflow-y:auto;padding:10px 10px 14px;display:flex;flex-direction:column;gap:6px;scroll-behavior:smooth}
.dsep{align-self:center;font-size:.72rem;font-weight:600;background:var(--surface);color:var(--muted);padding:3px 10px;border-radius:8px;margin:6px 0}
.b{max-width:86%;border-radius:12px;padding:7px 9px 5px;font-size:.88rem;box-shadow:0 1px 1px rgba(0,0,0,.06);white-space:pre-line;overflow-wrap:anywhere}
.b.them{align-self:flex-start;background:var(--them);border-top-left-radius:4px}
.b.me{align-self:flex-end;background:var(--me);border-top-right-radius:4px}
.b.sys{align-self:center;background:var(--accent-soft);font-size:.8rem;text-align:center;max-width:94%}
.b .meta{display:flex;justify-content:flex-end;gap:6px;align-items:center;font-size:.68rem;color:var(--muted);margin-top:2px}
.tpl{font-size:.62rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:var(--tpl-soft);color:var(--fg);padding:1px 5px;border-radius:4px}
.b.new{animation:pop .28s ease-out}
@keyframes pop{from{transform:translateY(6px);opacity:.2}to{transform:none;opacity:1}}
.bwrap{align-self:flex-start;max-width:86%;display:flex;flex-direction:column;gap:3px;min-width:min(240px,86%)}
.bwrap .b{max-width:100%}
.qb{border:0;background:var(--them);color:var(--btn);font-weight:600;font-size:.86rem;padding:8px;border-radius:10px;cursor:pointer;box-shadow:0 1px 1px rgba(0,0,0,.06);display:flex;align-items:center;justify-content:center;gap:6px}
.qb[disabled]{opacity:.45;cursor:default}
.qb.pulse{animation:pl 1.3s ease-in-out infinite}
@keyframes pl{0%,100%{box-shadow:0 0 0 0 var(--pulse)}50%{box-shadow:0 0 0 6px var(--pulse)}}
.qb svg{width:14px;height:14px}
.rcpt-thumb{display:block;width:120px;height:150px;border-radius:8px;background:repeating-linear-gradient(0deg,#f7f5ef 0 13px,#e8e4da 13px 14px);color:#333;font-family:var(--mono);font-size:.62rem;padding:8px;line-height:1.3;white-space:pre}
.input{display:flex;gap:6px;padding:8px;background:var(--surface);border-top:1px solid var(--line)}
.input input{flex:1;min-width:0;border:1px solid var(--line);border-radius:20px;padding:8px 12px;background:var(--bg)}
.ib{border:0;width:38px;height:38px;border-radius:50%;background:var(--accent);color:var(--accent-ink);cursor:pointer;display:grid;place-items:center;flex:none}
.ib.alt{background:var(--surface-2);color:var(--fg)}
.ib svg{width:18px;height:18px}
.ib.pulse,.input input.pulse{animation:pl 1.3s ease-in-out infinite}

/* sheet */
.sheet-ov{position:absolute;inset:0;background:rgba(0,0,0,.38);display:flex;align-items:flex-end;z-index:5}
.sheet{background:var(--surface);width:100%;max-height:88%;overflow-y:auto;border-radius:18px 18px 0 0;padding:16px;display:flex;flex-direction:column;gap:10px;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
.sheet h3{margin:0;font-size:1.02rem}
.sheet .url{font-family:var(--mono);font-size:.7rem;color:var(--muted)}
.sheet dl{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;margin:0;font-size:.84rem;background:var(--surface-2);padding:10px;border-radius:10px}
.sheet dt{color:var(--muted)} .sheet dd{margin:0;min-width:0}
.sheet ul{margin:0;padding-left:18px;font-size:.84rem;display:flex;flex-direction:column;gap:3px}
.sheet .row{display:flex;gap:8px;flex-wrap:wrap}
.opt{border:1px solid var(--line);background:var(--surface);padding:11px;border-radius:10px;text-align:left;cursor:pointer;font-weight:600}
.opt:hover{border-color:var(--accent)}
.opt.pulse{animation:pl 1.3s ease-in-out infinite;border-color:var(--accent)}
.cmp{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.cmp>div{border:1px solid var(--line);border-radius:10px;padding:10px;font-size:.82rem;display:flex;flex-direction:column;gap:4px}
.ok{color:var(--accent);font-weight:700}
.spin{width:20px;height:20px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:spin .8s linear infinite;display:inline-block;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
.fld{display:flex;justify-content:space-between;gap:10px;font-size:.85rem;padding:7px 0;border-bottom:1px solid var(--line)}
.fld b{font-weight:600}
textarea{width:100%;min-height:90px;border:1px solid var(--line);border-radius:10px;padding:8px;background:var(--bg)}
.rost{display:flex;flex-direction:column;gap:6px}
.rost>div{display:flex;justify-content:space-between;gap:8px;font-size:.84rem;padding:8px;border-radius:8px;background:var(--surface-2)}
.pill{font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--accent-soft);white-space:nowrap}
.pill.w{background:var(--tpl-soft)}

/* branches */
.branches{padding-block:4px 40px;display:flex;flex-direction:column;gap:8px}
.branches h2{font-size:.78rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0}
.bl{display:flex;flex-wrap:wrap;gap:6px}
.bl button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;font-size:.84rem;font-weight:600;cursor:pointer}
.bl button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.note{font-size:.82rem;color:var(--muted);max-width:72ch}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 18px);background:var(--fg);color:var(--bg);padding:9px 15px;border-radius:10px;font-weight:600;font-size:.88rem;z-index:30;max-width:calc(100% - 32px)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#d0453a;margin-left:5px;vertical-align:middle}
@media (max-width:860px){
  .stage{grid-template-columns:minmax(0,400px)}
  .tabs{display:flex;justify-content:center}
  .phone.hide{display:none}
  .screen{height:min(680px,calc(100vh - 250px))}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;scroll-behavior:auto!important}}
</style>

<div class="wrap">

    <div class="ctl">
      <div class="cap"><div class="k" id="capk"></div><p id="cap"></p></div>

  <main class="stage" id="stage"></main>

</div>

function parse(p,text){
  const t=text.toLowerCase(),aw=S.await[p];S.await[p]=null;
  if(p==='k'){
    if(aw==='query'||aw==='reply'){S.await.k=aw;relay('k',text);S.await.k=null;return'type:k:query'}
    if(/tues|tisdag/.test(t)){L('k','K21');return'type:k:block'}
    if(/afternoon|eftermiddag/.test(t)){L('k','K20');return'type:k:unclear'}
    if(/sara/.test(t)&&/07[:.]?30|7[:.]30/.test(t)){L('k','K23');L('s','S28');return'type:k:ask'}
    if(/(thu|tor|gp|läkare|doctor|tomorrow|morgon)/.test(t)&&/\d/.test(t)){L('k','K02');return'type:k:need'}
    L('k','R19');return null;
  }
  if(aw==='amount'){const n=parseInt(t.replace(/\D/g,''),10);if(n>0){S.await.s='photo';return'type:s:amt'}S.await.s='amount';L('s','R22');return null}
  if(aw==='photo'){S.await.s='photo';L('s','R22');return null}
  if(aw==='travel'){L('s','S22');return'type:s:travel'}
  if(aw==='hours'){S.inv=11800;L('s','S27');return'type:s:hours'}
  if(aw==='msgK'||aw==='reply'){S.await.s=aw;relay('s',text);S.await.s=null;return'type:s:msg'}
  if(/^(pause|paus)/.test(t)){L('s','S32');return'type:s:pause'}
  if(/resume|starta/.test(t)){L('s','R21');return null}
  L('s','R22');return null;
}

/* ============ engine ============ */
function advanceIf(key){const st=cur();if(!st||S.ended)return;const m=st.m;if(!m)return;
  if(key===m||(m.endsWith(':score')&&key&&key.startsWith(m))){S.step++;checkEnd()}else if(key&&!key.startsWith('type:s:amt')&&!key.startsWith('open:'))S.off=true}
function checkEnd(){if(S.step>=flowSteps().length)S.ended=true}
function press(p,msg,key,val){
  // msg: message object; key: button key
  const mid=msg.mid,b=(M[mid][3]||[]).find(x=>x[0]===key),type=b?b[3]||'r':'r';
  const st=cur();if(st&&st.m&&(st.m===mid+':'+key||st.m===mid+':score')&&st.t)S.clock=Math.max(S.clock,st.t);
  if(type==='s'){openSheet({type:'score',p,mid,msgId:msg.id});return}
  if(type==='l'){const f=H[mid+':'+key];if(f){S.sheetFor=mid+':'+key;f()}render();return}
  msg.used=true;U(p,btnLabel(mid,key));
  const f=H[mid+':'+key];if(f)f();
  advanceIf(mid+':'+key);render();
}
function chooseScore(val){const sh=S.sheet;const msg=S.chat[sh.p].find(m=>m.id===sh.msgId);S.sheet=null;msg.used=true;const lab=SC.find(x=>x[0]===val);U(sh.p,[lab[1],lab[2]]);scoreHandler(sh.mid,val);advanceIf(sh.mid+':score:'+val);render()}
function typed(p,text){
  const st=cur();if(st&&st.m&&st.m.startsWith('type:'+p)&&st.t)S.clock=Math.max(S.clock,st.t);
  U(p,text);const k=parse(p,text);
  if(k==='type:s:amt'){render();return}
  advanceIf(k);render();
}
function nextStep(silent){
  if(S.sheet){ if(S.sheet.type==='contract'){doSign(true);return} if(S.sheet.type==='score'){const st=cur();chooseScore(st&&st.v||'5');return} S.sheet=null;render();return}
  const st=cur();
  if(!st||S.ended){if(!silent)toast(u(S.flow==='main'?'endmain':'endbr'));return}
  if(st.t)S.clock=Math.max(S.clock,st.t);
  if(st.auto){AUTO[st.auto]();S.step++;checkEnd();if(!silent)render();return}
  const [a,b,c]=st.m.split(':');
  if(a==='type'){
    const txt=TYPED[st.txt][li()];
    if(st.txt==='park'){U('s',txt);S.await.s=null;S.await.s='photo';sendPhoto();S.step++;checkEnd();if(!silent)render();return}
    U(b,txt);const k=parse(b,txt);advanceIf(k);if(!silent)render();return;
  }
  const p=a[0]==='K'?'k':'s',msg=lastMsg(p,a,true)||lastMsg(p,a,false);
  if(!msg){toast(u('none'));return}
  const bt=(M[a][3]||[]).find(x=>x[0]===b),type=bt?bt[3]||'r':'r';
  if(type==='s'){msg.used=true;const lab=SC.find(x=>x[0]===st.v);U(p,[lab[1],lab[2]]);scoreHandler(a,st.v);S.step++;checkEnd();if(!silent)render();return}
  if(type==='l'&&b==='sign'){ if(silent){completeSign(p);return} S.sheetFor=a+':sign';sheet('contract',p);render();return}
  msg.used=true;U(p,btnLabel(a,b));const f=H[a+':'+b];if(f)f();S.step++;checkEnd();if(!silent)render();
}
function completeSign(p){S.sheet=null;if(p==='k'){signedKarin()}else{L('s','S05');L('k','K08')}

    <b>${sh('terms')}</b><ul><li>${sh('t1')}</li><li>${sh('t2')}</li><li>${sh('t3')}</li><li>${sh('t4')}</li></ul>
    ${s.done?`<p class="ok">${sh('signed')}</p>`:s.busy?`<p><span class="spin"></span> ${sh('opening')}</p>`:`<div class="row"><button class="btn pri" data-a="sign" id="signbtn">${sh('signb')}</button>${close}</div>`}`;
  }else if(s.type==='profile'){
    h=`<span class="url">${sh('url')}d/sara-lindqvist</span><h3>${sh('prof')}: Sara Lindqvist</h3><p class="ok">${sh('verified')}</p>
    <dl><dt>${sh('lic')}</dt><dd style="font-family:var(--mono)">418204</dd><dt>${sh('grade')}</dt><dd>${sh('gp')}</dd><dt>${sh('yrs')}</dt><dd>12</dd><dt>${sh('langs')}</dt><dd>SV, EN</dd><dt>${sh('ehr')}</dt><dd>Cosmic, TakeCare</dd><dt>${sh('rating')}</dt><dd>★ ${LANG==='sv'?'4,8':'4.8'} · 97%</dd><dt>${sh('docs')}</dt><dd>${sh('docsv')}</dd></dl>${close}`;
  }else if(s.type==='compare'){
    const col=(n,d,r,re,sh2,tot)=>`<div><b>${n}</b><span>${sh('dist')}: ${d}</span><span>${sh('rating')}: ${r}</span><span>${sh('here')}: ${sh2}</span><span>${sh('reqs')}: ${re}</span><span>${sh('tot')}: <b>${tot}</b></span></div>`;
    h=`<span class="url">${sh('url')}s/thu-29-oct/applicants</span><h3>${sh('cmp')}</h3><div class="cmp">${col('Sara Lindqvist','≈55 km','★ 4.8 · 97%',sh('nreq'),'14',LANG==='sv'?'10 650 kr':'10,650 SEK')}${col('Per Nyström','≈185 km','★ 4.4 · 88%',sh('acc'),'6',LANG==='sv'?'11 550 kr + resa':'11,550 SEK + travel')}</div>
    <div class="row"><button class="btn pri" data-a="cmpconf" data-v="sara">${sh('conf')} Sara</button><button class="btn" data-a="cmpconf" data-v="per">${sh('conf')} Per</button>${close}</div>`;
  }else if(s.type==='roster'){
    const [st1,c1]=shiftStatus(),sat=S.chat.k.some(m=>m.mid==='K17'||m.mid==='R04')?(LANG==='sv'?'Öppet för alla, 1 270 kr/tim':'Open to all, 1,270 SEK/h'):(S.chat.k.some(m=>m.mid==='K29')?(LANG==='sv'?'Hos bemanningsbolag + Locumo':'With agencies + Locumo'):(LANG==='sv'?'Obemannat':'Unfilled'));
    const rows=LANG==='sv'?[['mån 26 okt 08–17','Johan Berg',''],['tis 27 okt 08–17','Sara Lindqvist',''],['ons 28 okt 08–17','Amira Haddad',''],['tor 29 okt 08–17',st1,c1],['fre 30 okt 08–17','Johan Berg',''],['lör 31 okt 09–15',sat,'w']]:[['Mon 26 Oct 08–17','Johan Berg',''],['Tue 27 Oct 08–17','Sara Lindqvist',''],['Wed 28 Oct 08–17','Amira Haddad',''],['Thu 29 Oct 08–17',st1,c1],['Fri 30 Oct 08–17','Johan Berg',''],['Sat 31 Oct 09–15',sat,'w']];
    h=`<span class="url">${sh('url')}roster</span><h3>${sh('roster')}</h3><div class="rost">${rows.map(r=>`<div><span>${r[0]}</span><span class="pill ${r[2]}">${r[1]}</span></div>`).join('')}</div>${close}`;
  }else if(s.type==='settings'){
    const f=LANG==='sv'?[['Timarvode','1 150 kr'],['Egen personal först','4 tim'],['Tidigare anlitade','12 tim'],['Tidig bonus','300 kr inom 4 tim'],['Resetak','800 kr'],['Arvode visas för','Alla'],['Sen avbokning','48 tim, 50 %']]:[['Hourly rate','1,150 SEK'],['Own staff first','4 h'],['Alumni','12 h'],['Early bonus','300 SEK within 4 h'],['Travel cap','800 SEK'],['Rate shown to','Everyone'],['Late cancellation','48 h, 50%']];
    h=`<span class="url">${sh('url')}settings</span><h3>${sh('set')}</h3>${f.map(x=>`<div class="fld"><span>${x[0]}</span><b>${x[1]}</b></div>`).join('')}<div class="row"><button class="btn pri" data-a="savesheet">${sh('save')}</button>${close}</div>`;
  }else if(s.type==='prefs'){
    const f=LANG==='sv'?[['Utgångsort','Härnösand'],['Radie','150 km'],['Lägsta timarvode','1 000 kr'],['Dagar','mån–lör'],['Tyst tid','22:00–07:00'],['Kanal','WhatsApp (SMS som reserv)']]:[['Home base','Härnösand'],['Radius','150 km'],['Minimum rate','1,000 SEK/h'],['Days','Mon–Sat'],['Quiet hours','22:00–07:00'],['Channel','WhatsApp (SMS as backup)']];
    h=`<span class="url">${sh('url')}me/preferences</span><h3>${sh('prefs')}</h3>${f.map(x=>`<div class="fld"><span>${x[0]}</span><b>${x[1]}</b></div>`).join('')}<div class="row"><button class="btn pri" data-a="savesheet">${sh('save')}</button>${close}</div>`;
  }else if(s.type==='concern'){
    h=`<span class="url">${sh('url')}concern</span><h3>${sh('conc')}</h3><p style="margin:0;font-size:.85rem">${sh('concb')}</p><textarea id="conc-t" aria-label="${sh('conc')}"></textarea><div class="row"><button class="btn pri" data-a="sendconc">${sh('sendb')}</button>${close}</div>`;
  }else if(s.type==='receipt'){
    h=`<span class="url">${sh('url')}r/LOC-2026-1049/2</span><h3>${sh('rcpt')}</h3><span class="rcpt-thumb" style="width:100%;height:auto">${rcptText()}</span>${close}`;
  }
  return`<div class="sheet-ov" data-a="ovclose"><div class="sheet" role="dialog" aria-modal="true">${h}</div></div>`;
}
function rcptText(){return'P-SUNDSVALL AB\nBjörkdalsvägen 12\n\n29-10-2026  07:52\nZon 4  Dag\n\nATT BETALA   80,00 SEK\nKort ****\n\nTACK!'}

/* ============ render ============ */
const LOGO='<svg viewBox="0 0 32 32" aria-hidden="true"><rect x="1" y="1" width="30" height="30" rx="9" fill="var(--accent)"/><path d="M16 5.6c-4.5 0-8.1 3.5-8.1 7.9 0 5.7 8.1 13 8.1 13s8.1-7.3 8.1-13c0-4.4-3.6-7.9-8.1-7.9z" fill="var(--accent-ink)"/><path d="M12.3 13.4l2.6 2.6 4.9-4.9" fill="none" stroke="var(--accent)" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const ICS={send:'<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 20.5v-6l8-2.5-8-2.5v-6L22 12z"/></svg>',cam:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 8h3l2-2.5h6L17 8h3v11H4z"/><circle cx="12" cy="13.5" r="3.5"/></svg>',link:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9M18 14v6H4V6h6"/></svg>',list:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M5 6h14M5 12h14M5 18h14"/></svg>'};
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function fmtN(n){return new Intl.NumberFormat(LANG==='sv'?'sv-SE':'en-GB').format(n)}
function msgText(m){let s=M[m.mid][1+li()];if(m.vars)for(const k in m.vars){let v=m.vars[k];v=typeof v==='number'?fmtN(v):Array.isArray(v)?v[li()]:v;s=s.split('{'+k+'}').join(v)}return s}
const FD={};function fdt(ms,o,key){const k=key+LANG;return(FD[k]||(FD[k]=new Intl.DateTimeFormat(LANG==='sv'?'sv-SE':'en-GB',Object.assign({timeZone:'Europe/Stockholm'},o)))).format(ms)}
const hm=ms=>fdt(ms,{hour:'2-digit',minute:'2-digit',hourCycle:'h23'},'hm');
const dlab=ms=>fdt(ms,{weekday:'short',day:'numeric',month:'short'},'d');
function expected(){if(S.sheet||S.ended)return null;const st=cur();if(!st||!st.m)return null;return st.m}
let LASTSEQ=0;
function phoneHTML(p){
  const exp=expected(),[ea,eb]=exp?exp.split(':'):[];
  let pulseMsg=null;if(exp&&ea!=='type'){const pp=ea[0]==='K'?'k':'s';if(pp===p)pulseMsg=lastMsg(p,ea,true)||lastMsg(p,ea,false)}
  let lastDay='',out='';
  for(const m of S.chat[p]){
    const d=dlab(m.at);if(d!==lastDay){out+=`<div class="dsep">${esc(d)}</div>`;lastDay=d}
    const isNew=Date.now()-(m.ts||0)<450?' new':'';
    if(m.who==='me'){
      const txt=Array.isArray(m.text)?m.text[li()]:m.text;
      out+=`<div class="b me${isNew}">${m.photo?`<span class="rcpt-thumb">${esc(rcptText())}</span>`:esc(txt)}<div class="meta">${hm(m.at)} ✓✓</div></div>`;continue}
    const def=M[m.mid],btns=def[3]||[];
    out+=`<div class="bwrap"><div class="b them${isNew}">${esc(msgText(m))}<div class="meta">${def[0]?`<span class="tpl">${u('tpl')}</span>`:''}${hm(m.at)}</div></div>`;
    for(const b of btns){const type=b[3]||'r',dis=type==='r'&&m.used,pl=pulseMsg===m&&b[0]===eb;
      out+=`<button class="qb ${pl?'pulse':''}" data-a="qb" data-p="${p}" data-m="${m.id}" data-k="${b[0]}" ${dis?'disabled':''}>${type==='l'?ICS.link:type==='s'?ICS.list:''}${esc(b[1+li()])}</button>`}
    out+='</div>';
  }
  const typePulse=exp&&ea==='type'&&eb===p;
  const showCam=p==='s';
  return`<div class="phone" id="ph-${p}"><p class="who">${u(p==='k'?'karin':'sara')}</p><div class="screen">
  <div class="ph-head">${LOGO}<div><b>Locumo</b><span><span class="v">✓</span> ${u('biz')}</span></div></div>
  <div class="msgs" id="msgs-${p}">${out}</div>
  <form class="input" data-p="${p}"><input type="text" id="in-${p}" class="${typePulse?'pulse':''}" placeholder="${u('typemsg')}" autocomplete="off" aria-label="${u('typemsg')} ${p==='k'?'Karin':'Sara'}">${showCam?`<button type="button" class="ib alt ${S.await.s==='photo'?'pulse':''}" data-a="photo" aria-label="${u('photo')}">${ICS.cam}</button>`:''}<button class="ib" type="submit" aria-label="${u('send')}">${ICS.send}</button></form>
  ${S.sheet&&S.sheet.p===p?sheetHTML():''}</div></div>`;
}
function render(){
  document.documentElement.lang=LANG;
  document.querySelectorAll('[data-a=lang]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===LANG));
  document.getElementById('brand').innerHTML=`${LOGO}<span class="bname">locum<span class="bo">o</span></span><span class="sub">${u('sub')}</span>`;
  const steps=flowSteps(),st=cur();
  let cap='';for(let i=Math.min(S.step,steps.length-1);i>=0;i--){if(steps[i].c){cap=steps[i].c[li()];break}}
  if(S.ended)cap=u(S.flow==='main'?'endmain':'endbr');else if(S.off)cap=u('offpath');
  document.getElementById('capk').textContent=(S.flow==='main'?u('main'):u('branch')+': '+BR.find(b=>b[0]===S.flow)[1+li()])+' · '+(S.ended?u('done'):u('step').replace('{n}',S.step+1).replace('{t}',steps.length));
  document.getElementById('cap').textContent=cap;
  document.getElementById('clock').textContent=dlab(S.clock)+' '+hm(S.clock);
  document.getElementById('nx').textContent=u('next');document.getElementById('bk').textContent=u('back');document.getElementById('rs').textContent=u('restart');
  document.getElementById('nx').disabled=S.ended&&!S.sheet;document.getElementById('bk').disabled=!HIST.length;
  const tb=document.getElementById('tabs');tb.innerHTML=['k','s'].map(p=>`<button data-a="tab" data-v="${p}" aria-pressed="${S.tab===p}">${u(p==='k'?'karin':'sara')}${S.unread[p]&&S.tab!==p?'<span class="dot"></span>':''}</button>`).join('');
  const keep={};['k','s'].forEach(p=>{const el=document.getElementById('in-'+p);if(el)keep[p]=el.value});
  const stage=document.getElementById('stage');stage.innerHTML=phoneHTML('k')+phoneHTML('s');
  ['k','s'].forEach(p=>{const el=document.getElementById('in-'+p);if(el&&keep[p])el.value=keep[p];const ph=document.getElementById('ph-'+p);if(ph)ph.classList.toggle('hide',S.tab!==p);const box=document.getElementById('msgs-'+p);if(box)box.scrollTop=box.scrollHeight});
  document.getElementById('brh').textContent=u('brh');
  document.getElementById('bl').innerHTML=BR.map(b=>`<button data-a="branch" data-v="${b[0]}" aria-pressed="${S.flow===b[0]}">${esc(b[1+li()])}</button>`).join('');
  document.getElementById('note').textContent=u('note');
  // follow the phone that needs action on mobile
  LASTSEQ=S.seq;
}
function autoTab(){const exp=expected();if(!exp)return;const [a,b]=exp.split(':');const p=a==='type'?b:(a[0]==='K'?'k':'s');if(S.tab!==p){S.tab=p;S.unread[p]=0}}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,2600)}

/* ============ init / branches ============ */
function start(){S=fresh();L('k','K01');L('s','S01');S.unread={k:0,s:0};S.clock=T('10-26','09:00')}
function startBranch(name){start();const br=BRANCH[name];for(let i=0;i<br.at;i++)nextStep(true);S.flow=name;S.step=0;S.ended=false;S.off=false;S.sheet=null;S.unread={k:0,s:0};HIST=[];autoTab();LASTSEQ=S.seq;render()}

/* ============ events ============ */
document.addEventListener('click',e=>{
  const ov=e.target.closest('[data-a=ovclose]');if(ov&&e.target===ov){if(S.sheet&&!S.sheet.busy){S.sheet=null;render()}return}
  const el=e.target.closest('[data-a]');if(!el)return;const a=el.dataset.a;
  if(a==='lang'){LANG=el.dataset.v;try{localStorage.setItem('locumo-chat-lang',LANG)}catch(_){}render();return}
  if(a==='tab'){S.tab=el.dataset.v;S.unread[S.tab]=0;render();return}
  if(a==='next'){snap();nextStep(false);autoTab();render();return}
  if(a==='back'){const h=HIST.pop();if(h){S=JSON.parse(h);LASTSEQ=S.seq;render()}return}
  if(a==='restart'){HIST=[];start();LASTSEQ=S.seq;render();return}
  if(a==='branch'){startBranch(el.dataset.v);return}
  if(a==='qb'){snap();const p=el.dataset.p,msg=S.chat[p].find(m=>m.id===Number(el.dataset.m));press(p,msg,el.dataset.k);autoTab();render();return}
  if(a==='score'){snap();chooseScore(el.dataset.v);autoTab();render();return}
  if(a==='sign'){doSign(false);return}
  if(a==='closesheet'){if(S.sheet&&S.sheet.busy)return;S.sheet=null;render();return}
  if(a==='cmpconf'){snap();const d=el.dataset.v;S.sheet=null;const msg=lastMsg('k','K05',true)||lastMsg('k','K05');const st=cur();if(st&&st.m==='K05:'+(d==='per'?'cper':'csara'))S.clock=Math.max(S.clock,st.t);if(msg){msg.used=true;U('k',btnLabel('K05',d==='per'?'cper':'csara'))}confirm(d);advanceIf('K05:'+(d==='per'?'cper':'csara'));render();return}
  if(a==='savesheet'){S.sheet=null;render();toast(u('saved'));return}
  if(a==='sendconc'){S.sheet=null;render();toast(u('sentc'));return}
  if(a==='photo'){snap();const k=sendPhoto();if(k){advanceIf(k)}autoTab();render();return}
});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target,p=f.dataset.p,inp=f.querySelector('input'),v=inp.value.trim();if(!v)return;snap();inp.value='';typed(p,v);autoTab();render()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.sheet&&!S.sheet.busy){S.sheet=null;render()}});

start();LASTSEQ=S.seq;render();
</script>
