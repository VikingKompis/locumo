<style>
/* Layout: sticky two-row app header (brand/role/language, then tabs/demo clock); one content column, max 1080px; work items as cards, state shown by coloured dot + label */
:root{
  --bg:#f2f6f4; --surface:#ffffff; --surface-2:#e8efec; --fg:#13211d; --muted:#596a64; --line:#d3ddd9;
  --accent:#0c6857; --accent-ink:#ffffff; --accent-soft:#d3eae2;
  --gap:#7d8b86; --posted:#b67507; --app:#2a62c4; --ok:#1b7c44; --done:#34443f; --bad:#bd3a2a;
  --gap-soft:#e3e9e6; --posted-soft:#f5e8cf; --app-soft:#dbe6f8; --ok-soft:#d5eedf; --done-soft:#e1e7e5; --bad-soft:#f5dad5;
  --avl:86%; --avf:24%;
  --shadow:0 1px 2px rgba(19,33,29,.06),0 8px 24px rgba(19,33,29,.08);
  --font:'Schibsted Grotesk',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c1311; --surface:#131c19; --surface-2:#1a2521; --fg:#e3ede9; --muted:#93a39d; --line:#283631;
  --accent:#45c2a4; --accent-ink:#04231b; --accent-soft:#163a31;
  --gap:#7e8d88; --posted:#e4a944; --app:#7aa6f1; --ok:#52c585; --done:#b4c2bd; --bad:#f17d6b;
  --gap-soft:#212c28; --posted-soft:#3a2e16; --app-soft:#1a2944; --ok-soft:#153824; --done-soft:#222d29; --bad-soft:#41201a;
  --avl:28%; --avf:88%; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1311; --surface:#131c19; --surface-2:#1a2521; --fg:#e3ede9; --muted:#93a39d; --line:#283631;
  --accent:#45c2a4; --accent-ink:#04231b; --accent-soft:#163a31;
  --gap:#7e8d88; --posted:#e4a944; --app:#7aa6f1; --ok:#52c585; --done:#b4c2bd; --bad:#f17d6b;
  --gap-soft:#212c28; --posted-soft:#3a2e16; --app-soft:#1a2944; --ok-soft:#153824; --done-soft:#222d29; --bad-soft:#41201a;
  --avl:28%; --avf:88%; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
h1,h2,h3{line-height:1.2;text-wrap:balance;margin:0}
h1{font-size:1.6rem;font-weight:800;letter-spacing:-.01em}
h2{font-size:1.15rem;font-weight:700}
h3{font-size:1rem;font-weight:700}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
.mono,.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:10px}
.brand{display:flex;align-items:center;gap:8px;margin-right:auto}
.brand svg{width:28px;height:28px;flex:none}
.bname{font-weight:800;font-size:1.3rem;letter-spacing:-.03em}
.bo{color:var(--accent)}
.demo{font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;padding:2px 7px;border-radius:99px;background:var(--posted-soft);color:var(--fg)}
.seg{display:inline-flex;background:var(--surface-2);border-radius:99px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:99px;font-weight:600;font-size:.88rem;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.sub{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-block:0 8px}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;flex:1 1 420px;min-width:0}
.tabs::-webkit-scrollbar{display:none}
.tabs button{border:0;background:transparent;padding:8px 11px;border-radius:8px;font-weight:600;font-size:.9rem;white-space:nowrap;cursor:pointer;color:var(--muted)}
.tabs button[aria-current="page"]{background:var(--accent-soft);color:var(--fg)}
.count{display:inline-block;min-width:1.4em;padding:0 5px;border-radius:99px;background:var(--bad);color:#fff;font-size:.72rem;line-height:1.4em;text-align:center}
.clock{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:.85rem}
.clock b{font-family:var(--mono);font-weight:500;font-size:.82rem}
.clock .clabel{color:var(--muted)}
.clock button{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:3px 8px;font-size:.8rem;font-weight:600;cursor:pointer}
.clock button:hover{border-color:var(--accent)}

/* main */
.main{padding-block:22px 64px;display:flex;flex-direction:column;gap:18px}
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px 20px;flex-wrap:wrap}
.pagehead>div{min-width:0;max-width:62ch}
.lede{color:var(--muted);margin-top:4px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:10px 14px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:14px}
.section-title{font-size:.74rem;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:6px 0 -2px}

/* stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat .v{font-size:1.5rem;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.stat .k{font-size:.82rem;color:var(--muted)}

/* buttons & fields */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:8px 14px;border-radius:9px;font-weight:600;font-size:.9rem;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn.sm{padding:5px 10px;font-size:.82rem;border-radius:8px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.link{border:0;background:none;padding:0;color:var(--accent);font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>span{font-size:.82rem;font-weight:600;color:var(--muted)}
.field.inline{flex-direction:row;align-items:center;gap:8px}
input[type=text],input[type=number],input[type=date],input[type=time],select,textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;min-height:38px}
textarea{min-height:76px;resize:vertical}
.field.inline select{width:auto}
input[type=range]{width:100%;accent-color:var(--accent)}
input[type=checkbox],input[type=radio]{accent-color:var(--accent);width:17px;height:17px}
.check{display:flex;gap:8px;align-items:flex-start;cursor:pointer}
.check input{margin-top:3px;flex:none}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:14px}
.form .full{grid-column:1/-1}
fieldset{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin:0;min-width:0}
legend{font-weight:700;padding:0 6px}
.days{display:flex;gap:6px;flex-wrap:wrap}
.days label{display:inline-flex;position:relative}
.days input{position:absolute;opacity:0;width:1px;height:1px}
.days span{display:inline-block;padding:6px 11px;border-radius:99px;border:1px solid var(--line);font-weight:600;font-size:.85rem;cursor:pointer}
.days input:checked+span{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.days input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}

/* pills & tags */
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 9px 3px 8px;border-radius:99px;font-size:.78rem;font-weight:600;white-space:nowrap;background:var(--gap-soft)}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--gap);flex:none}
.pill.posted{background:var(--posted-soft)} .pill.posted i{background:var(--posted)}
.pill.app{background:var(--app-soft)} .pill.app i{background:var(--app)}
.pill.ok{background:var(--ok-soft)} .pill.ok i{background:var(--ok)}
.pill.done{background:var(--done-soft)} .pill.done i{background:var(--done)}
.pill.bad{background:var(--bad-soft)} .pill.bad i{background:var(--bad)}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:.76rem;font-weight:600;padding:3px 8px;border-radius:6px;background:var(--surface-2);color:var(--fg)}
.tag.acc{background:var(--accent-soft)}
.verified{display:inline-flex;align-items:center;gap:4px;font-size:.78rem;font-weight:700;color:var(--ok)}
.verified svg{width:15px;height:15px}

/* alerts */
.alert{display:flex;gap:8px 14px;align-items:center;flex-wrap:wrap;border-radius:var(--r);padding:12px 14px;border:1px solid var(--line);background:var(--surface)}
.alert.bad{background:var(--bad-soft);border-color:color-mix(in srgb,var(--bad) 35%,transparent)}
.alert.warn{background:var(--posted-soft);border-color:color-mix(in srgb,var(--posted) 35%,transparent)}
.alert.info{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 30%,transparent)}
.alert>span{flex:1 1 260px;min-width:0}

/* roster board */
.legend{display:flex;gap:6px;flex-wrap:wrap}
.day{display:grid;grid-template-columns:96px 1fr;gap:10px;padding-block:10px;border-top:1px solid var(--line)}
.day:first-child{border-top:0}
.dlabel{font-weight:700;font-size:.9rem;padding-top:8px}
.dlabel small{display:block;font-weight:500;color:var(--muted);font-size:.78rem}
.dlabel.today{color:var(--accent)}
.chips{display:flex;flex-direction:column;gap:6px;min-width:0}
.chip{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 12px;align-items:center;text-align:left;width:100%;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:9px 12px;cursor:pointer}
.chip:hover{border-color:var(--accent)}
.ctime{font-family:var(--mono);font-size:.82rem}
.cmain{display:flex;flex-direction:column;min-width:0}
.cmain b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cmain span{font-size:.8rem}
.empty-day{color:var(--muted);font-size:.85rem;padding-top:8px}
@media (max-width:560px){
  .day{grid-template-columns:1fr;gap:6px}
  .dlabel{padding-top:0}
  .chip{grid-template-columns:1fr auto;}
  .chip .ctime{grid-column:1/-1}
}

/* shift cards */
.shift .when{font-size:.85rem;color:var(--muted)}
.shift h3{margin-top:2px}
.rate{font-family:var(--mono);font-weight:500;font-size:1.05rem;text-align:right}
.rate small{display:block;font-family:var(--font);font-size:.75rem;color:var(--muted)}
.shift .top{align-items:flex-start;justify-content:space-between}
.shift .top>div:first-child{min-width:0;flex:1 1 220px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.foot{justify-content:space-between;border-top:1px solid var(--line);padding-top:10px;margin-top:2px}
.applied{font-weight:600;color:var(--app)}
.logi{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:.88rem;background:var(--surface-2);border-radius:8px;padding:10px 12px}
.logi dt{color:var(--muted)} .logi dd{margin:0;min-width:0}

/* people */
.person{display:flex;gap:12px;align-items:center;min-width:0}
.person>div{min-width:0}
.av{--h:160;display:inline-grid;place-items:center;width:38px;height:38px;border-radius:50%;flex:none;font-weight:700;font-size:.85rem;background:hsl(var(--h) 38% var(--avl));color:hsl(var(--h) 45% var(--avf))}
.av.lg{width:56px;height:56px;font-size:1.1rem}
.list{display:flex;flex-direction:column}
.list>.li{display:flex;gap:10px 14px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:12px 0;border-top:1px solid var(--line)}
.list>.li:first-child{border-top:0;padding-top:4px}

/* table */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:.74rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);background:var(--surface-2)}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}

/* invoice lines */
.lines{display:flex;flex-direction:column;gap:6px}
.line{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px 12px;align-items:center;font-size:.9rem;padding:8px 10px;background:var(--surface-2);border-radius:8px}
.line .amt{font-family:var(--mono)}
.total{display:flex;justify-content:space-between;font-weight:700;padding:8px 10px}
.total .amt{font-family:var(--mono)}

/* timeline */
.tl{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tl>div{border-radius:8px;padding:8px 10px;background:var(--surface-2);font-size:.8rem;min-width:0}
.tl>div b{display:block;font-size:.85rem}
.tl>div.on{background:var(--posted-soft);outline:2px solid var(--posted)}
.tl>div.past{opacity:.6}

/* stars */
.stars{display:flex;gap:2px}
.stars button{border:0;background:none;font-size:1.5rem;line-height:1;padding:2px;cursor:pointer;color:var(--line)}
.stars button.on{color:var(--posted)}
.star{color:var(--posted)}
.rq{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}

/* modal */
.ov{position:fixed;inset:0;z-index:50;background:rgba(8,16,13,.5);display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 24px) max(12px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 24px) max(12px,env(safe-area-inset-left,0px))}
.modal{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);width:100%;max-width:660px;padding:20px;display:flex;flex-direction:column;gap:14px}
.mhead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.x{border:0;background:var(--surface-2);width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:1.1rem;flex:none}
.doc{border:1px solid var(--line);border-radius:10px;padding:16px;font-size:.9rem;display:flex;flex-direction:column;gap:10px;background:var(--bg)}
.doc h3{font-size:1.05rem}
.doc ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.sig{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:10px}
.sig>div{border:1px dashed var(--line);border-radius:8px;padding:10px;font-size:.85rem}
.sig .ok{color:var(--ok);font-weight:700}
.bankid{display:flex;align-items:center;gap:10px;padding:12px;border-radius:10px;background:var(--surface-2)}
.spin{width:22px;height:22px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
.steps{display:flex;gap:6px}
.steps i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.steps i.on{background:var(--accent)}

/* applicants */
.appl{border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px}
.appl.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.appl .tot{font-family:var(--mono);font-weight:600}

/* chart */
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-family:var(--mono);font-size:10px}
.bars{display:flex;flex-direction:column;gap:8px}
.bar-row{display:grid;grid-template-columns:110px 1fr 44px;gap:10px;align-items:center;font-size:.85rem}
.bar-track{height:10px;background:var(--surface-2);border-radius:5px;overflow:hidden}
.bar-fill{height:100%;background:var(--accent);border-radius:5px}

/* toast */
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 20px);z-index:60;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:.9rem;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
pre.code{background:var(--surface-2);border-radius:8px;padding:10px 12px;overflow-x:auto;font-family:var(--mono);font-size:.8rem;margin:0}
.drop{border:2px dashed var(--line);border-radius:var(--r);padding:22px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.ev{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.ev:first-child{border-top:0}
.ev .dot{width:9px;height:9px;border-radius:50%;background:var(--line);margin-top:7px;flex:none}
.ev.new .dot{background:var(--app)}
.ev>div{min-width:0;flex:1}
details summary{cursor:pointer;font-weight:600}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div id="app"></div>
<div id="modal-root"></div>
<div id="toast" role="status" aria-live="polite" hidden></div>

function relation(d,orgId){const o=org(orgId);if(o.own.includes(d.id))return'own';if(o.alumni.includes(d.id))return'alumni';return'open'}
function tier(sh,now){now=now||S.clock;if(sh.urgent)return 3;const e=(now-sh.postedAt)/H;if(e<sh.t1)return 1;if(e<sh.t1+sh.t2)return 2;return 3}

function tierEnd(sh){const tr=tier(sh);if(tr===3)return null;return tr===1?sh.postedAt+sh.t1*H:sh.postedAt+(sh.t1+sh.t2)*H}
function effRate(sh){return tier(sh)===3&&sh.raisePct?Math.round(sh.rate*(1+sh.raisePct/100)/10)*10:sh.rate}
function isBlocked(d,orgId){return org(orgId).blocked.some(b=>b.doctorId===d.id&&b.status==='active')}
function check(d,sh){
  const s=site(sh.siteId),o=org(s.orgId);
  if(d.status!=='verified')return{ok:false,why:'why_unverified'};
  if(isBlocked(d,o.id))return{ok:false,why:'why_blocked'};
  if(GR[d.grade]<GR[sh.grade])return{ok:false,why:'why_grade'};
  if(d.docs.some(x=>x.exp&&x.exp<sh.end))return{ok:false,why:'why_docs'};
  const dist=kmC(d.city,s.city);if(dist>d.radius)return{ok:false,why:'why_radius',dist};
  const rel=relation(d,o.id),tr=tier(sh);
  if(tr===1&&rel!=='own')return{ok:false,why:'why_tier',opens:tierStart(sh,rel==='alumni'?2:3)};
  if(tr===2&&rel==='open')return{ok:false,why:'why_tier',opens:tierStart(sh,3)};
  if(!d.avail.includes(wdOf(sh.start)))return{ok:false,why:'why_avail'};
  if(effRate(sh)<d.minRate)return{ok:false,why:'why_rate'};
  if(S.shifts.some(x=>x!==sh&&x.doctorId===d.id&&x.status==='confirmed'&&x.start<sh.end&&x.end>sh.start))return{ok:false,why:'why_overlap'};
  return{ok:true,dist,rel};
}

/* ================= simulation ================= */
function botApply(sh,tr){
  const c=S.doctors.filter(d=>d.id!==S.asDoctor&&!sh.applicants.some(a=>a.doctorId===d.id)&&check(d,sh).ok);
  if(!c.length)return;
  const d=c[(hash(sh.id)+tr)%c.length],dist=kmC(d.city,site(sh.siteId).city);
  let req=null;
  if(dist>170&&!sh.extras.accomm)req={type:'accomm',amount:1100,note:{en:'One night at a hotel',sv:'En natt på hotell'}};
  else if(dist>25){const a=travelFor(dist);if(a>sh.extras.travelCap)req={type:'travel',amount:a,note:{en:'2 × '+Math.round(dist)+' km, milersättning 25 kr/mil',sv:'2 × '+Math.round(dist)+' km, milersättning 25 kr/mil'}}}
  sh.applicants.push({doctorId:d.id,at:S.clock,req,tier:tr});
  if(isOwn(sh))ev('clinic','ev_applied',{name:d.name,when:sh.start},sh.id);
}
function tick(){
  const now=S.clock;
  for(const sh of S.shifts){
    if(sh.status==='posted'){
      if(sh.start<=now){sh.status='unfilled';if(isOwn(sh))ev('clinic','ev_unfilled',{when:sh.start},sh.id);continue}
      const tr=tier(sh);
      if(now-tierStart(sh,tr)>=H&&!sh.botTiers.includes(tr)){sh.botTiers.push(tr);botApply(sh,tr)}
    }else if(sh.status==='confirmed'){
      const d=doc(sh.doctorId);
      if(sh.contract&&!sh.contract.doctorSignedAt&&sh.doctorId!==S.asDoctor&&now-sh.confirmedAt>=H){sh.contract.doctorSignedAt=now;if(isOwn(sh))ev('clinic','ev_signed',{name:d.name,when:sh.start},sh.id)}
      if(now>=sh.end){sh.status='awaiting';const o=org(site(sh.siteId).orgId);if(relation(d,o.id)==='open')o.alumni.push(d.id);if(sh.doctorId===S.asDoctor)ev(d.id,'ev_ts_due',{site:site(sh.siteId).name},sh.id)}
    }
    if(sh.status==='awaiting'&&sh.doctorId!==S.asDoctor&&now-sh.end>=2*H)submitTimesheet(sh,[]);
  }
  notifyCurrent();
}

function submitTimesheet(sh,added){
  const d=doc(sh.doctorId),o=org(site(sh.siteId).orgId),rel=relation(d,o.id);

/* ---------- clinic: roster board ---------- */
function vBoard(){
  const now=S.clock,ds0=dstr(now),endW=at(addD(ds0,14),'00:00');
  const mine=S.shifts.filter(sh=>isOwn(sh)&&sh.status!=='cancelled'&&(S.siteFilter==='all'||sh.siteId===S.siteFilter)&&sh.end>sod(now)&&sh.start<endW);
  const filled=mine.filter(sh=>sh.status==='confirmed'||DONE.includes(sh.status)).length;
  const open=mine.filter(sh=>['gap','posted','unfilled'].includes(sh.status));
  const risk=mine.filter(sh=>['gap','posted'].includes(sh.status)&&sh.start>now&&sh.start-now<=48*H).sort((a,b)=>a.start-b.start);
  const waiting=mine.filter(sh=>sh.status==='posted'&&sh.applicants.length);
  const gaps=mine.filter(sh=>sh.status==='gap'&&sh.start>now);
  const cov=mine.length?Math.round(filled/mine.length*100):100;
  let h=`<div class="pagehead"><div><h1>${t('board_title')}</h1><p class="lede">${t('board_lede')}</p></div>
  <label class="field inline"><span>${t('site')}</span><select id="sitefilter" data-a="sitefilter"><option value="all">${t('all_sites')}</option>${ownSites().map(s=>`<option value="${s.id}" ${S.siteFilter===s.id?'selected':''}>${esc(s.name)}</option>`).join('')}</select></label></div>`;
  if(risk.length)h+=`<div class="alert bad"><span><b>${t('risk_title',{n:risk.length})}.</b> ${t('risk_body')}</span><button class="btn sm" data-a="openshift" data-v="${risk[0].id}">${t('view_first')}</button></div>`;
  h+=`<div class="stats">${stat(cov+'%',t('st_coverage'))}${stat(open.length,t('st_open'))}${stat(waiting.length,t('st_waiting'))}${stat(gaps.length,t('st_gaps'),gaps.length?`<button class="link small" data-a="publishgaps">${t('publish_all')}</button>`:'')}</div>`;
  h+=`<div class="legend">${[['gap','lg_gap'],['posted','lg_posted'],['app','lg_app'],['ok','lg_ok'],['done','lg_done'],['bad','lg_bad']].map(([v,k])=>pill(v,t(k))).join('')}</div>`;
  h+='<div class="card" style="padding-block:6px">';
  for(let i=0;i<14;i++){
    const ds=addD(ds0,i),day=mine.filter(sh=>dstr(sh.start)===ds).sort((a,b)=>a.start-b.start||a.siteId.localeCompare(b.siteId));
    const wd=new Date(ds+'T12:00:00Z').getUTCDay();
    if(!day.length&&(wd===0||wd===6))continue;
    const ms=at(ds,'12:00');
    h+=`<div class="day"><div class="dlabel ${i===0?'today':''}">${esc(F('w',{weekday:'short'}).format(ms))} ${esc(F('dm',{day:'numeric',month:'short'}).format(ms))}<small>${i===0?t('today'):t('wk')+' '+isoWeek(ds)}</small></div><div class="chips">`;
    if(!day.length)h+=`<div class="empty-day">${t('no_shifts')}</div>`;
    for(const sh of day){const s=site(sh.siteId);h+=`<button class="chip" data-a="openshift" data-v="${sh.id}"><span class="ctime">${fTime(sh.start)}–${fTime(sh.end)}</span><span class="cmain"><b>${esc(s.name)}</b><span class="muted">${t(GK[sh.grade])}${sh.urgent&&sh.status==='posted'?' · '+t('tag_urgent'):''}</span></span>${pill(vis(sh),chipLabel(sh))}</button>`}
    h+='</div></div>';
  }
  return h+'</div>';
}

const HDR={date:['date','datum','dag','day'],start:['start','från','from','starttid'],end:['end','slut','till','to','sluttid'],grade:['role','roll','grade','nivå','kompetens','level'],doctor:['doctor','läkare','assigned','bemanning','namn','name'],site:['site','enhet','unit','mottagning']};
function normDate(v){v=String(v||'').trim();let m;if(m=v.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))return m[1]+'-'+m[2].padStart(2,'0')+'-'+m[3].padStart(2,'0');if(m=v.match(/^(\d{1,2})[\/.](\d{1,2})[\/.](\d{2,4})$/)){const y=m[3].length===2?'20'+m[3]:m[3];return y+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0')}if(/^\d{5}$/.test(v)){const d=new Date(Date.UTC(1899,11,30)+Number(v)*DAY);return d.toISOString().slice(0,10)}return null}
function normTime(v){v=String(v||'').trim().replace('.',':');const m=v.match(/^(\d{1,2}):?(\d{2})?/);if(!m)return null;return m[1].padStart(2,'0')+':'+(m[2]||'00')}
function normGrade(v){v=String(v||'').toLowerCase();if(/\bst\b|st-|registrar/.test(v))return'gp_st';if(/spec|allmän|gp|distrikt/.test(v))return'gp_spec';if(/leg|licen|bt|at/.test(v))return'licensed';return'gp_spec'}
function parseRows(rows){
  rows=rows.filter(r=>r&&r.some(c=>String(c||'').trim()));if(rows.length<2)return[];
  const head=rows[0].map(c=>String(c||'').trim().toLowerCase()),idx={};
  for(const k in HDR)idx[k]=head.findIndex(c=>HDR[k].includes(c));
  if(idx.date<0||idx.start<0||idx.end<0)return[];
  const out=[];
  for(const r of rows.slice(1)){
    const date=normDate(r[idx.date]),s=normTime(r[idx.start]),e=normTime(r[idx.end]);if(!date||!s||!e)continue;
    const doctor=idx.doctor>=0?String(r[idx.doctor]||'').trim():'';
    const gap=!doctor||/^(vakant|vacant|gap|open|ledig|obemannad|\?|-|—)$/i.test(doctor);
    const st=at(date,s);
    out.push({date,s,e,grade:normGrade(idx.grade>=0?r[idx.grade]:''),doctor:gap?'':doctor,gap,past:st<=S.clock});
  }
  return out;
}
function parseText(txt){const lines=txt.split(/\r?\n/).filter(x=>x.trim());if(!lines.length)return[];const dl=[';','\t',','].map(d=>[d,lines[0].split(d).length]).sort((a,b)=>b[1]-a[1])[0][0];return parseRows(lines.map(l=>l.split(dl).map(c=>c.replace(/^"|"$/g,''))))}
function sampleCSV(){
  const base=dstr(S.clock);let first=1;while(new Date(addD(base,first)+'T12:00:00Z').getUTCDay()!==1)first++;
  const names=['Johan Berg','Lina Karlsson','VAKANT','Sara Lindqvist','','Johan Berg','VAKANT','Lina Karlsson','Johan Berg','VAKANT'];

  return csv;
}

function lineRow(sh,l,i,editable){

  const stmap={agreed:['ok','ln_agreed'],auto:['ok','ln_auto'],review:['posted','ln_review'],approved:['ok','ln_ok'],rejected:['bad','ln_rej']}[l.status];
  const act=editable&&l.status==='review'?`<span class="actions"><button class="btn sm" data-a="lineok" data-v="${sh.id}" data-i="${i}">${t('approve')}</button><button class="btn sm danger" data-a="linerej" data-v="${sh.id}" data-i="${i}">${t('reject')}</button></span>`:pill(stmap[0],t(stmap[1]));
  return`<div class="line"><span>${lab}</span><span class="amt" style="${l.status==='rejected'?'text-decoration:line-through':''}">${money(l.amount)}</span>${act}</div>`;
}
function invCard(sh,role){
  const ts=sh.timesheet,d=doc(sh.doctorId),s=site(sh.siteId),overdue=sh.status==='approved'&&ts.dueAt&&S.clock>ts.dueAt;
  const editable=role==='clinic'&&sh.status==='submitted';
  let st=sh.status==='submitted'?pill('posted',t('st_submitted')):sh.status==='approved'?(overdue?pill('bad',t('overdue')):pill('app',t('due',{when:fDate(ts.dueAt)}))):pill('ok',t('st_paid',{when:fDate(ts.paidAt)}));
  let h=`<article class="card stack"><div class="row between"><div class="person">${role==='clinic'?avatar(d):''}<div><b>${esc(role==='clinic'?d.name:s.name)}</b><div class="muted small">${esc(role==='clinic'?s.name:s.city)} · ${esc(fDay(sh.start))} · <span class="mono">${esc(ts.number)}</span></div></div></div>${st}</div>
  <div class="small muted">${t(ts.kind==='invoice'?'kind_invoice':'kind_payroll')}</div>
  <div class="lines">${ts.lines.map((l,i)=>lineRow(sh,l,i,editable)).join('')}</div><div class="total"><span>${t('total')}</span><span class="amt">${money(tsTotal(ts))}</span></div><div class="row">`;
  if(role==='clinic'){
    if(sh.status==='submitted')h+=`<button class="btn pri" data-a="approveinv" data-v="${sh.id}">${t(ts.kind==='invoice'?'approve_inv':'approve_ts')}</button>`;
    if(sh.status==='approved'&&ts.kind==='invoice'&&!ts.peppolAt)h+=`<button class="btn" data-a="peppol" data-v="${sh.id}">${t('send_peppol')}</button>`;
    if(ts.peppolAt)h+=`<span class="small muted">${t('peppol_sent',{when:fDate(ts.peppolAt)})}</span>`;
    if(sh.status==='approved')h+=`<button class="btn" data-a="paid" data-v="${sh.id}">${t('mark_paid')}</button>`;
    if(DONE.includes(sh.status)&&!sh.ratings.clinic)h+=`<button class="btn" data-a="rate" data-v="${sh.id}">${t('rate_doctor',{name:d.name})}</button>`;

function ratingStatus(sh,role){const mine=role==='clinic'?sh.ratings.clinic:sh.ratings.doctor,theirs=role==='clinic'?sh.ratings.doctor:sh.ratings.clinic;if(!mine)return'';const reveal=!!theirs||S.clock-sh.end>14*DAY;let th='';if(theirs){const avg=theirs.s.reduce((a,b)=>a+b,0)/theirs.s.length;th=t('rt_theirs',{s:'★ '+num(avg,1)+(theirs.yes?' · '+tl('yes'):' · '+tl('no'))})}else th=t('rt_theirs_hidden');return`<p class="small muted">${t('rt_yours')} · ${reveal&&theirs?th:t('rt_theirs_hidden')}</p>`}

/* ---------- clinic: insights ---------- */
function vInsights(){
  const now=S.clock,from=now-56*DAY;
  const hist=S.shifts.filter(sh=>isOwn(sh)&&sh.start>=from&&sh.start<now&&sh.status!=='cancelled'&&sh.status!=='gap');
  const filled=hist.filter(sh=>DONE.includes(sh.status)),unf=hist.filter(sh=>sh.status==='unfilled');
  const rate=hist.length?Math.round(filled.length/hist.length*100):0;
  const ttf=filled.map(sh=>(sh.confirmedAt-sh.postedAt)/H).sort((a,b)=>a-b),med=ttf.length?ttf[Math.floor(ttf.length/2)]:0;
  const spend=filled.reduce((a,sh)=>a+(sh.timesheet?tsTotal(sh.timesheet):hrs(sh)*sh.rateFinal),0);
  const save=spend*S.settings.agencyPct/100;
  const price=S.settings.plan==='network'?7900:3900,sub=price*ownSites().length*2,cps=filled.length?sub/filled.length:0;
  const weeks=[];for(let w=8;w>=1;w--){const ws=now-w*7*DAY,we=ws+7*DAY;const f=filled.filter(sh=>sh.start>=ws&&sh.start<we).length,u=unf.filter(sh=>sh.start>=ws&&sh.start<we).length;weeks.push({lab:t('wk')+' '+isoWeek(dstr(ws+3*DAY)),f,u})}
  const max=Math.max(4,...weeks.map(w=>w.f+w.u)),W=320,Hh=170,pad=26,bw=(W-pad-8)/weeks.length;
  let bars='';weeks.forEach((w,i)=>{const x=pad+i*bw+bw*0.18,bwi=bw*0.64,hf=(Hh-40)*w.f/max,hu=(Hh-40)*w.u/max,yb=Hh-22;bars+=`<rect x="${x.toFixed(1)}" y="${(yb-hf).toFixed(1)}" width="${bwi.toFixed(1)}" height="${hf.toFixed(1)}" rx="2" fill="var(--accent)"/>`;if(w.u)bars+=`<rect x="${x.toFixed(1)}" y="${(yb-hf-hu-2).toFixed(1)}" width="${bwi.toFixed(1)}" height="${hu.toFixed(1)}" rx="2" fill="var(--bad)"/>`;bars+=`<text x="${(x+bwi/2).toFixed(1)}" y="${Hh-8}" text-anchor="middle">${esc(w.lab)}</text>`});
  let grid='';for(let g=0;g<=max;g+=Math.ceil(max/4)){const y=Hh-22-(Hh-40)*g/max;grid+=`<line x1="${pad}" x2="${W-4}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}" stroke="var(--line)" stroke-width="1"/><text x="${pad-6}" y="${(y+3).toFixed(1)}" text-anchor="end">${g}</text>`}
  const byT=[1,2,3].map(n=>filled.filter(sh=>sh.filledTier===n).length),tot=Math.max(1,filled.length);
  return`<div class="pagehead"><div><h1>${t('ins_title')}</h1><p class="lede">${t('ins_lede')}</p></div></div>
  <div class="stats">${stat(rate+'%',t('ins_fill'))}${stat(dur(med*H),t('ins_ttf'))}${stat(filled.length,t('ins_shifts'))}${stat(money(save),t('ins_save'))}${stat(money(cps),t('ins_cps'))}</div>
  <div class="grid2"><div class="card stack chart"><h2>${t('ins_weekly')}</h2><svg viewBox="0 0 ${W} ${Hh}" role="img" aria-label="${t('ins_weekly')}">${grid}${bars}</svg><div class="legend">${pill('ok',t('ins_filled'))}${pill('bad',t('ins_unfilled'))}</div></div>
  <div class="card stack"><h2>${t('ins_tier')}</h2><div class="bars">${byT.map((n,i)=>`<div class="bar-row"><span>${t('tier'+(i+1))}</span><div class="bar-track"><div class="bar-fill" style="width:${(n/tot*100).toFixed(0)}%"></div></div><span class="num">${n}</span></div>`).join('')}</div>
  <p class="small muted">${t('ins_spend')}: <span class="num">${money(spend)}</span>. ${t('ins_assume',{p:S.settings.agencyPct})}</p></div></div>`;
}

const mhead=(title,sub)=>`<div class="mhead"><div><h2>${title}</h2>${sub?`<p class="small muted">${sub}</p>`:''}</div><button class="x" data-a="close" aria-label="${t('md_close')}">×</button></div>`;
function mShift(){

      ${a.req?`<div class="line"><span>${t('sh_req',{type:tl('x_'+a.req.type).toLowerCase(),a:money(a.req.amount)})}${a.req.note?' · '+esc(tx(a.req.note)):''}</span><span></span><label class="check small"><input type="checkbox" data-req="${d.id}" ${ok?'checked':''}><span>${t('sh_req_ok')}</span></label></div>`:''}
      <div class="row between small"><span class="muted">${t('sh_total')}</span><span class="tot">${money(costOf(sh,a,ok))}</span></div></div>`}
    h+=`<div class="row">${sel?`<button class="btn pri" data-a="confirmpick" data-v="${sh.id}">${t('sh_confirm',{name:doc(sel).name})}</button>`:''}${tr<3?`<button class="btn" data-a="escalate" data-v="${sh.id}">${t('sh_escalate')}</button>`:''}<button class="btn" data-a="raise" data-v="${sh.id}">${t('sh_raise')}</button><button class="btn danger" data-a="ccancel" data-v="${sh.id}">${t('sh_cancel')}</button></div>`;

    ${sh.approvedExtras.length?`<div class="lines">${sh.approvedExtras.map(x=>`<div class="line"><span>${t('x_'+x.type)}</span><span class="amt">${money(x.amount)}</span><span></span></div>`).join('')}</div>`:''}
    <div class="row"><button class="btn" data-a="contract" data-v="${sh.id}">${t('view_contract')}</button><button class="btn danger" data-a="ccancel" data-v="${sh.id}">${t('sh_cancel')}</button></div>`;
    return h;
  }
  if(sh.doctorId){const d=doc(sh.doctorId);h+=`<div class="person">${avatar(d)}<div><b>${esc(d.name)}</b><div class="small muted">${t(GK[d.grade])}</div></div></div>`}
  if(sh.status==='awaiting')h+=`<p class="muted">${t('sh_ts_wait')}</p>`;
  if(['submitted','approved','paid'].includes(sh.status))h+=`<div class="row"><button class="btn pri" data-a="goinv">${t('go_invoices')}</button>${!sh.ratings.clinic?`<button class="btn" data-a="rate" data-v="${sh.id}">${t('rate_doctor',{name:doc(sh.doctorId).name})}</button>`:''}</div>`;

  if(sh.contract)h+=`<div><button class="btn sm" data-a="contract" data-v="${sh.id}">${t('view_contract')}</button></div>`;
  return h;
}

function mSignup(){
  const st=M.step||1;
  let h=mhead(t('su_title'))+`<div class="steps">${[1,2,3].map(n=>`<i class="${n<=st?'on':''}"></i>`).join('')}</div>`;
  if(st===1){h+=`<h3>${t('su_s1')}</h3><p class="small muted">${t('su_s1_body')}</p><label class="field"><span>${t('su_name')}</span><input type="text" id="su-name" data-m="name" value="${esc(M.name||'')}" autocomplete="name"></label>`;
    h+=M.busy?`<div class="bankid"><span class="spin"></span><span>${t('bankid_start')}</span></div>`:`<p class="small" id="su-err" role="alert" style="color:var(--bad)"></p><div class="row"><button class="btn pri" data-a="su1">${t('su_bankid')}</button></div>`}
  if(st===2){h+=`<h3>${t('su_s2')}</h3><label class="field"><span>${t('su_legit')}</span><input type="text" id="su-legit" data-m="legit" inputmode="numeric" maxlength="6" value="${esc(M.legit||'')}"></label>`;

    if(M.found===false)h+=`<div class="alert warn small"><span>${t('su_notfound')}</span></div><label class="btn" for="su-file">${t('su_upload')}</label><input type="file" id="su-file" accept=".pdf,image/*" hidden><span class="small muted" id="su-fn">${esc(M.file||'')}</span>`;
    h+=`<p class="small" id="su-err" role="alert" style="color:var(--bad)"></p><div class="row"><button class="btn" data-a="su2">${t('su_check')}</button>${M.found!=null?`<button class="btn pri" data-a="su2next">${t('md_next')}</button>`:''}</div>`}
  if(st===3){h+=`<h3>${t('su_s3')}</h3><div class="form"><label class="field"><span>${t('f_grade')}</span><select id="su-g" data-m="grade">${Object.keys(GR).map(g=>`<option value="${g}" ${M.grade===g?'selected':''}>${t(GK[g])}</option>`).join('')}</select></label>
   <label class="field"><span>${t('p_base')}</span><select id="su-c" data-m="city">${Object.keys(CITIES).map(c=>`<option ${M.city===c?'selected':''}>${esc(c)}</option>`).join('')}</select></label>
   <label class="field"><span>${t('p_radius')} (km)</span><input type="number" id="su-r" data-m="radius" value="${esc(M.radius||150)}" min="10" max="800"></label>
   <label class="field"><span>${t('p_minrate')}</span><input type="number" id="su-m" data-m="minRate" value="${esc(M.minRate||1000)}" min="0" step="50"></label></div>
   <div class="row"><button class="btn" data-a="su3back">${t('md_back')}</button><button class="btn pri" data-a="su3">${t('su_done')}</button></div>`}
  return h;
}

function confirmApplicant(sh,did,extras){
  const d=doc(did),a=sh.applicants.find(x=>x.doctorId===did);
  sh.status='confirmed';sh.doctorId=did;sh.rateFinal=effRate(sh);sh.confirmedAt=S.clock;sh.filledTier=a?a.tier:tier(sh);sh.approvedExtras=extras;
  sh.contract={model:S.settings.model,clinicSignedAt:S.clock,clinicSigner:'Karin Ek',doctorSignedAt:null};
  for(const x of sh.applicants)if(x.doctorId!==did&&x.doctorId===S.asDoctor)ev(x.doctorId,'ev_not_sel',{site:site(sh.siteId).name,when:sh.start},sh.id);
  if(did===S.asDoctor)ev(did,'ev_confirmed',{site:site(sh.siteId).name,when:sh.start},sh.id);
}

function readFile(file){if(!file)return;const r=new FileReader();const isX=/\.xlsx?$/i.test(file.name);r.onload=()=>{let rows=[];try{if(isX&&window.XLSX){const wb=XLSX.read(new Uint8Array(r.result),{type:'array',cellDates:true});const ws=wb.Sheets[wb.SheetNames[0]];rows=parseRows(XLSX.utils.sheet_to_json(ws,{header:1,raw:false,dateNF:'yyyy-mm-dd',defval:''}))}else rows=parseText(String(r.result))}catch(e){rows=[]}IMP={rows,site:IMP?IMP.site:'s1'};render()};if(isX)r.readAsArrayBuffer(file);else r.readAsText(file)}

document.addEventListener('click',e=>{
  const ov=e.target.closest('[data-ov]');if(ov&&e.target===ov){closeM();return}
  const el=e.target.closest('[data-a]');if(!el||el.tagName==='SELECT'||el.tagName==='FORM')return;
  const fn=A[el.dataset.a];if(fn){e.preventDefault();fn(el,e)}
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.tagName==='SELECT'&&el.dataset.a&&A[el.dataset.a])A[el.dataset.a](el,e);
  if(el.dataset.m!==undefined&&M){M[el.dataset.m]=el.type==='checkbox'?el.checked:el.value;if(el.dataset.m==='reason')renderModal()}
  if(el.dataset.req!==undefined&&M){M.reqOk=M.reqOk||{};M.reqOk[el.dataset.req]=el.checked;renderModal()}
  if(el.dataset.tl!==undefined&&M){M.lines[Number(el.dataset.tl)][el.dataset.f]=el.type==='checkbox'?el.checked:el.value;if(el.dataset.f!=='note')renderModal()}
  if(el.id==='roster-file')readFile(el.files[0]);
  if(el.id==='imp-site'&&IMP)IMP.site=el.value;
  if(el.id==='su-file'&&M){M.file=el.files[0]?el.files[0].name:'';renderModal()}
  if(el.dataset.up!==undefined){const d=cur(),x=d.docs[Number(el.dataset.up)];x.exp=Math.max(x.exp||0,S.clock)+365*DAY;afterChange(t('d_uploaded'))}
});
document.addEventListener('input',e=>{
  const el=e.target;
  if(el.dataset.m!==undefined&&M)M[el.dataset.m]=el.value;
  if(el.dataset.tl!==undefined&&M&&el.type!=='checkbox')M.lines[Number(el.dataset.tl)][el.dataset.f]=el.value;
  if(el.id==='p-radius')$('#p-radius-v').textContent=el.value+' km';
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&M)closeM()});
document.addEventListener('dragover',e=>{const d=e.target.closest&&e.target.closest('#drop');if(d){e.preventDefault();d.classList.add('over')}});
document.addEventListener('dragleave',e=>{const d=e.target.closest&&e.target.closest('#drop');if(d)d.classList.remove('over')});
document.addEventListener('drop',e=>{const d=e.target.closest&&e.target.closest('#drop');if(d){e.preventDefault();readFile(e.dataTransfer.files[0])}});
document.addEventListener('submit',e=>{
  e.preventDefault();const f=e.target,a=f.dataset.a,fd=new FormData(f);
  if(a==='post'){
    const date=fd.get('date'),s=fd.get('start'),en=fd.get('end'),rate=Number(fd.get('rate')),err=$('#pf-err');
    if(!date||!s||!en||at(date,en)<=at(date,s)){err.textContent=t('err_time');return}
    if(at(date,s)<=S.clock){err.textContent=t('err_past');return}
    if(!(rate>0)){err.textContent=t('err_rate');return}
    const rep=Math.min(10,Math.max(0,Number(fd.get('repeat'))||0));const dates=[date];let ds=date;while(dates.length<rep+1){ds=addD(ds,1);const w=new Date(ds+'T12:00:00Z').getUTCDay();if(w!==0&&w!==6)dates.push(ds)}
    for(const dd of dates){S.shifts.push({id:'sh'+(++S.seq),siteId:fd.get('site'),grade:fd.get('grade'),rate,rateFinal:null,notes:String(fd.get('notes')||'').trim(),rateVis:fd.get('rateVis')||'all',t1:Number(fd.get('t1'))||0,t2:Number(fd.get('t2'))||0,urgent:fd.get('urgent')==='on',raisePct:Number(fd.get('raise'))||0,extras:{travelCap:Number(fd.get('travelCap'))||0,accomm:fd.get('accomm')==='on'},status:'posted',postedAt:S.clock,applicants:[],doctorId:null,confirmedAt:null,filledTier:null,approvedExtras:[],contract:null,timesheet:null,ratings:{},botTiers:[],notified:[],source:'manual',cancel:null,start:at(dd,s),end:at(dd,en)})}
    notifyCurrent();S.view.clinic='board';afterChange(t('posted_ok',{n:dates.length}));
  }
  if(a==='savesettings'){const s=S.settings;s.plan=fd.get('plan');['t1','t2','raisePct','travelCap','cancelH','cancelPct','agencyPct'].forEach(k=>s[k]=Number(fd.get(k))||0);s.rateVis=fd.get('rateVis');s.accomm=fd.get('accomm')==='on';s.model=fd.get('model');afterChange(t('saved'))}
  if(a==='saveprofile'){const d=cur();d.city=fd.get('city');d.minRate=Number(fd.get('minRate'))||0;d.radius=Number(fd.get('radius'))||50;d.avail=fd.getAll('avail').map(Number);d.quiet=[fd.get('q1')||'22:00',fd.get('q2')||'07:00'];notifyCurrent();afterChange(t('saved'))}
});

/* ================= boot ================= */
S=load()||seed();
render();
</script>

</html>
